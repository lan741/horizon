[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon's iOS/iPadOS platform layer: the app bundle entry, the Metal surface, ProMotion frame pacing and the touch model"

# One executable per app bundle; iOS launches `Payload/Horizon.app/Horizon`.
[[bin]]
name = "horizon-ios"
path = "src/main.rs"
test = false

[dependencies]
winit = "0.30.13"
# Metal on iOS; the same wgpu the renderer already uses, so the port keeps one graphics path.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
pollster = "0.4"
log = "0.4"

[lints]
workspace = true